name: Bible Verse Scanner APK

on:
  push:
    branches:
      - "**"
    paths:
      - "web/bible_verse_scanner/**"
      - ".github/workflows/bible-verse-scanner-apk.yml"
  pull_request:
    paths:
      - "web/bible_verse_scanner/**"
      - ".github/workflows/bible-verse-scanner-apk.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: web/bible_verse_scanner

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: bible-verse-scanner-debug-apk
          path: web/bible_verse_scanner/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
